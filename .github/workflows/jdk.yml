name: Java runtimes

# Cross-compiles the Java runtimes Minecraft asks for. These change only when a JDK update release
# lands, so the workflow is manual and tag-triggered rather than running on every push.
on:
  workflow_dispatch:
    inputs:
      features:
        description: 'JSON array of feature releases to build, e.g. ["21","25"]'
        required: false
        default: '["8","17","21","25"]'
      abis:
        description: 'JSON array of ABIs, e.g. ["arm64-v8a"]'
        required: false
        default: '["arm64-v8a","x86_64"]'
  push:
    tags:
      - 'runtime-v*'

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.resolve.outputs.features }}
      abis: ${{ steps.resolve.outputs.abis }}
    steps:
      - id: resolve
        run: |
          echo "features=${{ github.event.inputs.features || '["8","17","21","25"]' }}" >> "$GITHUB_OUTPUT"
          echo "abis=${{ github.event.inputs.abis || '["arm64-v8a","x86_64"]' }}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      # One failing combination must not cancel the others: a JDK 8 failure should not cost us the
      # JDK 21 runtime that was already most of the way through a two-hour build.
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.matrix.outputs.features) }}
        abi: ${{ fromJSON(needs.matrix.outputs.abis) }}

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # An OpenJDK build tree plus the NDK comfortably exceeds what a hosted runner has spare.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: runtime/docker
          tags: lodestone-jdk-builder:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cross-compile OpenJDK ${{ matrix.feature }} for ${{ matrix.abi }}
        run: |
          mkdir -p "${{ github.workspace }}/out"
          docker run --rm \
            -v "${{ github.workspace }}/runtime/patches:/work/patches:ro" \
            -v "${{ github.workspace }}/out:/work/out" \
            lodestone-jdk-builder:latest \
            --feature "${{ matrix.feature }}" \
            --abi "${{ matrix.abi }}" \
            --jobs "$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: lodestone-jre${{ matrix.feature }}-${{ matrix.abi }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/runtime-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          # The app downloads runtimes from this release rather than bundling them in the APK,
          # which keeps the download under Play's size limit and lets a runtime be replaced
          # without shipping a new app version.
          fail_on_unmatched_files: true
