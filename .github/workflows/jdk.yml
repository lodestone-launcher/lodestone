name: Java runtimes

# Cross-compiles the Java runtimes Minecraft asks for. These change only when a JDK update release
# lands, so the workflow is manual and tag-triggered rather than running on every push.
on:
  workflow_dispatch:
    inputs:
      features:
        description: 'JSON array of feature releases to build, e.g. ["21","25"]'
        required: false
        default: '["8","17","21","25"]'
      abis:
        description: 'JSON array of ABIs, e.g. ["arm64-v8a"]'
        required: false
        default: '["arm64-v8a","x86_64"]'
  push:
    tags:
      - 'runtime-v*'

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.resolve.outputs.features }}
      abis: ${{ steps.resolve.outputs.abis }}
    steps:
      - id: resolve
        run: |
          echo "features=${{ github.event.inputs.features || '["8","17","21","25"]' }}" >> "$GITHUB_OUTPUT"
          echo "abis=${{ github.event.inputs.abis || '["arm64-v8a","x86_64"]' }}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      # One failing combination must not cancel the others: a JDK 8 failure should not cost us the
      # JDK 21 runtime that was already most of the way through a two-hour build.
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.matrix.outputs.features) }}
        abi: ${{ fromJSON(needs.matrix.outputs.abis) }}

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # An OpenJDK build tree plus the NDK comfortably exceeds what a hosted runner has spare.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: runtime/docker
          tags: lodestone-jdk-builder:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cross-compile OpenJDK ${{ matrix.feature }} for ${{ matrix.abi }}
        run: |
          mkdir -p "${{ github.workspace }}/out" "${{ github.workspace }}/src"
          # /work/src is mounted rather than left inside the container: without it every run
          # re-clones several hundred megabytes of OpenJDK, which dominates the iteration loop
          # while the bionic patch set is still being developed.
          docker run --rm \
            -v "${{ github.workspace }}/runtime/patches:/work/patches:ro" \
            -v "${{ github.workspace }}/src:/work/src" \
            -v "${{ github.workspace }}/out:/work/out" \
            lodestone-jdk-builder:latest \
            --feature "${{ matrix.feature }}" \
            --abi "${{ matrix.abi }}" \
            --jobs "$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: lodestone-jre${{ matrix.feature }}-${{ matrix.abi }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  gl4es:
    # The desktop-GL translation layer. Far cheaper to build than a JDK, so it runs on every
    # dispatch rather than waiting for a runtime tag.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Build gl4es for ${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          bash runtime/build-gl4es.sh --abi "${{ matrix.abi }}" --output "${{ github.workspace }}/out"

      - uses: actions/upload-artifact@v4
        with:
          name: gl4es-${{ matrix.abi }}
          path: out/**
          if-no-files-found: error

  zink:
    # Mesa's desktop GL over Vulkan, for the 1.17+ versions gl4es cannot reach. Slower than gl4es
    # because it builds the whole of Mesa plus Turnip, but still nothing next to a JDK.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        abi: [arm64-v8a]
    steps:
      - uses: actions/checkout@v4

      - name: Build Zink for ${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          # meson, ninja and mako come from the venv the script creates; these are the pieces it
          # cannot install itself. glslang-tools compiles Turnip's built-in shaders.
          sudo apt-get update && sudo apt-get install -y bison flex glslang-tools pkg-config python3-venv
          bash runtime/build-zink.sh --abi "${{ matrix.abi }}" --output "${{ github.workspace }}/out"

      - uses: actions/upload-artifact@v4
        with:
          name: zink-${{ matrix.abi }}
          path: out/**
          if-no-files-found: error

  lwjgl:
    # Mojang's manifests only ever carry x86-64 Linux natives, so these are not an optimisation:
    # without them the game dies in GL.<clinit> on the first dlopen of an extracted library.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]
        # One set per LWJGL release the supported versions pin. The generated JNI libraries bind
        # only to the release they came from, so 26.2's 3.4.1 cannot run on 3.3.3's natives and
        # 1.21.4's 3.3.3 cannot run on 3.4.1's.
        version: ["3.3.3", "3.4.1"]
        include:
          # FreeType and OpenAL Soft are not generated from the bindings and have no version
          # coupling, so one build of each serves every set and it rides along with the oldest.
          - version: "3.3.3"
            third_party: "yes"
          - version: "3.4.1"
            third_party: "no"
    steps:
      - uses: actions/checkout@v4

      - name: Build the LWJGL ${{ matrix.version }} natives for ${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          # libffi is configured from a git checkout rather than a release tarball, so its
          # `configure` has to be generated first; ninja drives the FreeType and OpenAL builds.
          sudo apt-get update && sudo apt-get install -y autoconf automake libtool ninja-build
          bash runtime/build-lwjgl.sh \
            --version "${{ matrix.version }}" \
            --abi "${{ matrix.abi }}" \
            --third-party "${{ matrix.third_party }}" \
            --output "${{ github.workspace }}/out/${{ matrix.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: lwjgl-${{ matrix.version }}-${{ matrix.abi }}
          path: out/**
          if-no-files-found: error

  release:
    needs: [build, gl4es, zink, lwjgl]
    if: startsWith(github.ref, 'refs/tags/runtime-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          # The app downloads runtimes from this release rather than bundling them in the APK,
          # which keeps the download under Play's size limit and lets a runtime be replaced
          # without shipping a new app version.
          fail_on_unmatched_files: true
