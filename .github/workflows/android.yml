name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK the build pins
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Unit tests
        # These parse real published Minecraft manifests, so a Mojang format change surfaces here
        # rather than on a user's device.
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # LWJGL resolves every GLFW entry point in a static initialiser and throws on the first one
      # it cannot find, so a shim missing a symbol does not lose a feature — it ends the launch
      # before the game draws anything, naming a function nobody called. Checked against the
      # bindings of the LWJGL release the launcher ships rather than a list kept by hand.
      - name: Check the GLFW shim against LWJGL's symbol table
        run: |
          for abi in arm64-v8a x86_64; do
            library="$(find app/build/intermediates/cxx -path "*/$abi/liblodestone_glfw.so" | head -1)"
            [ -n "$library" ] || { echo "no shim built for $abi" >&2; exit 1; }
            ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" \
              runtime/check-glfw-exports.sh --library "$library"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: lodestone-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
